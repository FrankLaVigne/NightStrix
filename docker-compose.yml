services:
  # go2rtc: pulls the hub's RTSP streams and re-serves them to browsers (WebRTC/MSE).
  # Ports are published explicitly so this works on Docker Desktop (Windows/macOS) as well
  # as Linux. Set webrtc.candidates in go2rtc.yaml to this machine's LAN IP for WebRTC;
  # without it, browsers fall back to MSE via the viewer on 8099, which still works.
  go2rtc:
    image: alexxit/go2rtc:1.9.14
    container_name: nightstrix-go2rtc
    ports:
      - "8554:8554"       # RTSP re-stream
      - "8555:8555/tcp"   # WebRTC
      - "8555:8555/udp"
    restart: unless-stopped
    volumes:
      - ./go2rtc.yaml:/config/go2rtc.yaml:ro

  # viewer: tiny nginx that serves the NightStrix grid page on port 8099.
  viewer:
    image: nginx:1.30-alpine
    container_name: nightstrix-viewer
    restart: unless-stopped
    ports:
      - "8099:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - go2rtc
