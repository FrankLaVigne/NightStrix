# Serves the NightStrix page and proxies a minimal allowlist of go2rtc under /go2rtc/, so the
# browser only needs port 8099 (go2rtc's 1984 is never published — it falls in a port range
# Windows reserves).
server {
  listen 80;
  root /usr/share/nginx/html;

  # Never cache the camera list or the page shell, so edits to cams.js (e.g. adding a
  # camera) show up on a normal reload instead of a stale cached copy.
  location = /cams.js   { add_header Cache-Control "no-store" always; }
  location = /          { add_header Cache-Control "no-store" always; }
  location = /index.html { add_header Cache-Control "no-store" always; }

  # go2rtc is proxied by ALLOWLIST: only the player and the endpoints the wall uses. The rest
  # of its API (config incl. RTSP credentials, stream creation, admin UI) has no login, so it
  # must not be reachable from the LAN.
  proxy_http_version 1.1;
  proxy_set_header Host $host;

  # Player page + scripts (static, served by go2rtc).
  location = /go2rtc/stream.html     { proxy_pass http://go2rtc:1984/stream.html; }
  location = /go2rtc/video-stream.js { proxy_pass http://go2rtc:1984/video-stream.js; }
  location = /go2rtc/video-rtc.js    { proxy_pass http://go2rtc:1984/video-rtc.js; }

  # go2rtc treats a `src` that isn't a known stream name as a NEW source (rtsp://, http://,
  # ffmpeg:, ...) and connects to it. So the WHOLE query string must be exactly what the wall
  # sends: checking $arg_src alone is bypassable, because go2rtc percent-decodes parameter
  # names (`%73rc=rtsp://…&src=cam1` reaches go2rtc with src=rtsp://…) and nginx does not.
  location = /go2rtc/api/ws {
    if ($args !~ "^src=[A-Za-z0-9_-]{1,64}$") { return 400; }
    proxy_pass http://go2rtc:1984/api/ws;
    proxy_set_header Upgrade $http_upgrade;       # WebSocket (MSE + WebRTC signaling)
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_read_timeout 1h;
  }
  location = /go2rtc/api/frame.jpeg {
    if ($args !~ "^src=[A-Za-z0-9_-]{1,64}(&_=[0-9]{1,20})?$") { return 400; }
    proxy_pass http://go2rtc:1984/api/frame.jpeg;
  }

  # HLS fallback (iOS): addressed by a session id created over the WebSocket, not by `src`.
  location ~ ^/go2rtc/api/hls/(playlist\.m3u8|segment\.ts|init\.mp4|segment\.m4s)$ {
    proxy_pass http://go2rtc:1984/api/hls/$1$is_args$args;
    proxy_buffering off;
  }

  # Everything else under /go2rtc/ is refused.
  location /go2rtc/ { return 404; }
}
